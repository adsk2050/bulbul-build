<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#101e2c" />
    <meta name="description" content="Bat five overs while Bulbul commentates every ball live in Hinglish, voiced by Sarvam Bulbul Flash." />
    <meta property="og:title" content="Bulbul Flash Cricket" />
    <meta property="og:description" content="Five overs, three wickets, and Bulbul on the mic for every ball. Can you beat your friends?" />
    <meta property="og:type" content="website" />
    <title>Bulbul Flash Cricket — live Bulbul commentary</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <script type="module" crossorigin src="./assets/index-ngIuz73W.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-D9Z8bbil.css">
  </head>
  <body>
    <div id="app"></div>
    <!-- Beside the game on a desktop, where there is room (see .desk-note in styles.css). -->
    <!-- Bulbul build: features that need the game's own server, or stand between the player and the innings. -->
    <style>
      /* The cover's title, in the game's display font, where its logo image was. */
      .bb-title{margin:0;text-align:center;font-family:var(--f-display);line-height:.92;color:#fff;
        text-shadow:0 3px 0 #b5470f,0 6px 14px rgba(0,0,0,.45);transform:rotate(-4deg)}
      .bb-title span{display:block;font-size:min(calc(var(--u) * 52),6.2cqh);color:#ffc93c}
      .bb-title b{display:block;font-size:min(calc(var(--u) * 64),7.6cqh);font-weight:400}
      /* "Powered by Sarvam AI": a slim strip just above the Play key, clear of the batter. */
      .bb-powered{display:flex;align-items:center;justify-content:center;gap:8px;align-self:center;margin:0 auto 4px;
        padding:6px 14px;width:max-content;background:rgba(255,255,255,.94);border-radius:999px;
        box-shadow:0 4px 14px rgba(0,0,0,.35);font-family:var(--f-ui);line-height:1;white-space:nowrap}
      .bb-powered span{font-size:9px;font-weight:700;letter-spacing:.14em;color:#6b7785}
      .bb-powered b{font-size:15px;font-weight:900;color:#0b1a2a}
      .bb-powered i{font-style:normal;font-size:10px;font-weight:700;color:#e0761b}
    </style>
    <!-- The voice calls every ball, so the game's text call-outs are hidden, except the big three:
         SIX, FOUR and a wicket (hitman-voice.js marks those with .bb-big). Timing hints stay hidden. -->
    <style>#result:not(.bb-big),#result #timing,#phase-label,#hit-burst,#nearing,#level-banner{display:none!important}</style>
    <style>#cover-profile,#feedback-open,#feedback-pause,#feedback-card,#challenge-set,#card-key,.ec-player{display:none!important}</style>
    <aside class="desk-note" aria-label="About this page">
      <h2>Bulbul on the mic</h2>
      <p>Every ball gets a live Hinglish line, spoken by Sarvam Bulbul. He remembers your past matches and coaches you from them.</p>
      <p class="bb-credit">The 3D game is open source, by <a href="https://github.com/ekcuttingchaidesign/Hitman-Cricket" target="_blank" rel="noopener">ekcuttingchaidesign</a>.</p>
      <p>Bat on the keyboard, or swipe on a phone:</p>
      <div class="desk-keys"><span class="desk-keyset"><kbd>←</kbd><kbd>↑</kbd><kbd>→</kbd><kbd>↓</kbd></span><span>or</span><span class="desk-keyset"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></span></div>
    </aside>
    <!-- bulbul-build: Bulbul live commentary (Sarvam Bulbul). The game is Hitman Cricket by ekcuttingchaidesign. -->
    <script src="/static/hitman-voice.js"></script>
    <!-- bulbul-build: the highlight reel and its Share button (records in the browser). -->
    <script src="/static/hitman-reel.js"></script>
  </body>
</html>
