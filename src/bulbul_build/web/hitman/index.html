    <style>
      /* The cover's title, in the game's display font, where its logo image was. */

    <aside class="desk-note" aria-label="About this page">

      <p>Every ball gets a live Hinglish line, spoken by Sarvam Bulbul. He remembers your past matches and coaches you from them.</p>
      <p class="bb-credit">The 3D game is open source, by <a href="https://github.com/ekcuttingchaidesign/Hitman-Cricket" target="_blank" rel="noopener">ekcuttingchaidesign</a>.</p>
      <p>Bat on the keyboard, or swipe on a phone:</p>
